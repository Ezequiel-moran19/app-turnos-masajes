<header>
  <div class="wrap">
    <nav aria-label="Principal">
      <a class="logo" href="#inicio"><i></i>{{ brand }}</a>
      <ul class="links" id="menu" [class.open]="open()">
        @for (l of links; track l.href) {
          <li><a [href]="l.href" (click)="open.set(false)">{{ l.label }}</a></li>
        }
      </ul>
      <div class="nav-r">
        <a class="btn pri nav-cta" href="#contacto">Reservar</a>
        <button type="button" class="burger" aria-controls="menu"
          [attr.aria-expanded]="open()"
          [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'"
          (click)="open.set(!open())" >
          <span></span><span></span>
        </button>
      </div>
    </nav>
  </div>
</header>
