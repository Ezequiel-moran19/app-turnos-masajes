<section id="servicios">
  <div class="wrap">
    <p class="eyebrow" appReveal>Tratamientos</p>
    <h2 appReveal>Masajes y terapias complementarias</h2>
    <p class="lead" appReveal>
      Conocé las opciones disponibles para acompañar tu sesión.
    </p>

    <div class="grid services">
      @for (t of treatments; track t.name; let i = $index) {
        <article class="card" [appReveal]="(i % 4) * 0.08">
          <div class="thumb">
            <img [src]="t.image" [alt]="t.name" loading="lazy" />
          </div>

          <div class="body">
            <h3>{{ t.name }}</h3>
            <p>{{ t.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
