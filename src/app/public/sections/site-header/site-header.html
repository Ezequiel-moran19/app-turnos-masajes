<header class="site-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg p-0" aria-label="Principal">

      <a class="navbar-brand logo" href="#inicio" aria-label="Inicio">
        <img src="/A-monograma-claro-.svg" alt="Logo" height="40">
      </a>

      <button class="navbar-toggler menu-toggle" type="button" aria-controls="menu" [attr.aria-expanded]="open()" [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'" (click)="open.set(!open())">
        <i class="bi" [class.bi-list]="!open()" [class.bi-x-lg]="open()"></i>
      </button>

      <div class="collapse navbar-collapse" [class.show]="open()" id="menu">
        <ul class="navbar-nav mx-auto gap-lg-4">
          @for (l of links; track l.href) {
            <li class="nav-item">
              <a class="nav-link" [href]="l.href" (click)="open.set(false)">
                {{ l.label }}
              </a>
            </li>
          }
        </ul>

        <div class="nav-actions">
          <a class="btn btn-brand nav-cta" href="#contacto">Reservar </a>
        </div>
      </div>

    </nav>
  </div>
</header>
